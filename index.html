<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ห้องเรียนสะอาด | เข้าสู่ระบบ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{teal:'#0F766E',ink:'#16243A',mist:'#F4F7FB'},fontFamily:{sans:['Noto Sans Thai','Tahoma','sans-serif']}}}}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-mist font-sans text-ink">
    <main class="grid min-h-screen place-items-center px-5 py-10">
      <section class="w-full max-w-md border border-slate-200 bg-white p-7 shadow-sm sm:p-9">
        <div class="grid h-12 w-12 place-items-center rounded-lg bg-teal text-2xl font-bold text-white">✦</div>
        <p class="mt-7 text-sm font-bold text-teal">CLASSROOM DUTY MANAGEMENT</p>
        <h1 class="mt-2 text-3xl font-bold">ห้องเรียนสะอาด</h1>
        <p class="mt-3 leading-7 text-slate-600">เข้าสู่ระบบเพื่อจองเวร ส่งหลักฐาน หรือดูแลการตรวจงานของห้อง ม.5/17</p>
        <form id="loginForm" class="mt-7 space-y-5">
          <label class="block text-sm font-bold">รหัสประจำตัว 5 หลัก<input id="schoolCode" class="mt-2 w-full border border-slate-300 px-3 py-3 outline-none focus:border-teal" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" placeholder="เช่น 54201" required /></label>
          <label class="block text-sm font-bold">รหัสผ่าน<input id="password" class="mt-2 w-full border border-slate-300 px-3 py-3 outline-none focus:border-teal" type="password" placeholder="skr54201" required /></label>
          <p id="loginError" class="hidden border-l-4 border-rose-500 bg-rose-50 px-3 py-2 text-sm text-rose-700" role="alert"></p>
          <button id="loginButton" class="w-full bg-teal px-4 py-3 font-bold text-white hover:bg-teal/90" type="submit">เข้าสู่ระบบ</button>
        </form>
        <!-- <div class="mt-7 border-t border-slate-100 pt-5 text-xs leading-6 text-slate-500"><p>นักเรียน: <strong>54201</strong> / <strong>skr54201</strong></p><p>ครู: <strong>90001</strong> / <strong>skr90001</strong></p></div> -->
      </section>
    </main>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
