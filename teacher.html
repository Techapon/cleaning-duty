<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ห้องเรียนสะอาด | ครู</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { teal: '#0F766E', ink: '#16243A', mist: '#F4F7FB' }, fontFamily: { sans: ['Noto Sans Thai', 'Tahoma', 'sans-serif'] } } } }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-mist font-sans text-ink">
    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-5 py-4 sm:px-8"><a
                class="flex items-center gap-3" href="teacher.html"><span
                    class="grid h-10 w-10 place-items-center rounded-lg bg-teal text-xl text-white">✦</span><span><strong
                        class="block text-lg leading-none">ห้องเรียนสะอาด</strong><small id="classroomName"
                        class="mt-1 block text-slate-500"></small></span></a>
            <div class="flex items-center gap-3"><span id="userName"
                    class="hidden text-sm font-medium sm:block"></span><button id="logoutButton"
                    class="border border-slate-300 px-3 py-2 text-sm font-bold hover:bg-slate-50"
                    type="button">ออกจากระบบ</button></div>
        </div>
    </header>
    <main class="mx-auto max-w-7xl px-5 py-8 sm:px-8">
        <div class="mb-7 flex flex-col justify-between gap-4 md:flex-row md:items-end">
            <div>
                <p id="todayLabel" class="text-sm font-bold text-teal"></p>
                <h1 class="mt-2 text-3xl font-bold sm:text-4xl">ตรวจเวรประจำวัน</h1>
                <p class="mt-2 text-slate-600">ติดตามการจอง การส่งหลักฐาน และประเมินผลงานของนักเรียน</p>
            </div><button id="showSchedule"
                class="border border-slate-300 bg-white px-4 py-2.5 text-sm font-bold hover:bg-slate-50"
                type="button">ดูตารางเวรรายสัปดาห์</button>
        </div>
        <div class="grid gap-4 sm:grid-cols-3">
            <div class="border-l-4 border-teal bg-white p-5 shadow-sm">
                <p class="text-sm text-slate-500">ส่งหลักฐานแล้ว</p>
                <p id="submittedCount" class="mt-1 text-3xl font-bold">0 <span class="text-base text-slate-400">/ 6
                        คน</span></p>
            </div>
            <div class="border-l-4 border-amber-400 bg-white p-5 shadow-sm">
                <p class="text-sm text-slate-500">จองแล้วแต่ยังไม่ส่ง</p>
                <p id="pendingCount" class="mt-1 text-3xl font-bold">0 <span class="text-base text-slate-400">คน</span>
                </p>
            </div>
            <div class="border-l-4 border-rose-500 bg-white p-5 shadow-sm">
                <p class="text-sm text-slate-500">ส่งเกินกำหนด</p>
                <p id="lateCount" class="mt-1 text-3xl font-bold">0 <span class="text-base text-slate-400">คน</span></p>
            </div>
        </div>
        <section class="mt-7 overflow-hidden border border-slate-200 bg-white shadow-sm">
            <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
                <h2 class="font-bold">รายการเวรวันนี้</h2><span id="dutyCount" class="text-sm text-slate-500"></span>
            </div>
            <div id="inspectionList" class="divide-y divide-slate-100"></div>
        </section>
        <section class="mt-7 border border-slate-200 bg-white shadow-sm">
            <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
                <div>
                    <h2 class="font-bold">รายชื่อนักเรียน</h2>
                    <p class="mt-1 text-sm text-slate-500">จัดเวรหมุนเวียนวันละ 6 คน</p>
                </div><span id="studentCount" class="rounded-full bg-slate-100 px-3 py-1 text-sm font-bold"></span>
            </div>
            <div id="roster"
                class="grid divide-x-0 divide-y divide-slate-100 sm:grid-cols-2 lg:grid-cols-3 lg:divide-x"></div>
        </section>
    </main>
    <dialog id="reviewDialog" class="modal">
        <form id="reviewForm" class="p-6">
            <p class="text-sm font-bold text-teal">ตรวจผลงาน</p>
            <h2 id="reviewName" class="mt-1 text-xl font-bold"></h2>
            <p id="reviewDetail" class="mt-1 text-sm text-slate-500"></p><img id="reviewImage"
                class="mt-5 aspect-[16/10] w-full object-cover" alt="รูปหลักฐาน" /><label
                class="mt-5 block text-sm font-bold">ผลการประเมิน<select id="reviewStatus"
                    class="mt-2 w-full border border-slate-300 px-3 py-3 outline-none focus:border-teal">
                    <option value="passed">ผ่านเรียบร้อย</option>
                    <option value="needs_improvement">ต้องแก้ไข</option>
                    <option value="absent">ขาดเวร</option>
                </select></label><label class="mt-4 block text-sm font-bold">เหตุผล (จำเป็นเมื่อไม่ผ่าน)<select
                    id="reasonPreset" class="mt-2 w-full border border-slate-300 px-3 py-3">
                    <option value="">เลือกเหตุผล</option>
                    <option value="กวาดไม่สะอาด">กวาดไม่สะอาด</option>
                    <option value="โต๊ะไม่เรียบร้อย">โต๊ะไม่เรียบร้อย</option>
                    <option value="ยังไม่ทิ้งขยะ">ยังไม่ทิ้งขยะ</option>
                    <option value="ไม่ส่งงาน">ไม่ส่งงาน</option>
                </select><textarea id="reasonText" class="mt-2 w-full border border-slate-300 px-3 py-3" rows="3"
                    placeholder="เพิ่มรายละเอียด (ถ้ามี)"></textarea></label>
            <p id="reviewError" class="mt-3 hidden text-sm text-rose-700"></p>
            <div class="mt-5 flex justify-end gap-3"><button id="cancelReview"
                    class="border border-slate-300 px-4 py-2.5 text-sm font-bold" type="button">ยกเลิก</button><button
                    class="bg-teal px-4 py-2.5 text-sm font-bold text-white" type="submit">บันทึกผล</button></div>
        </form>
    </dialog>
    <dialog id="scheduleDialog" class="modal">
        <div class="p-6">
            <div class="flex items-start justify-between">
                <div>
                    <p class="text-sm font-bold text-teal">ม.5/17</p>
                    <h2 class="mt-1 text-xl font-bold">ตารางเวรรายสัปดาห์</h2>
                </div><button id="closeSchedule" class="grid h-9 w-9 place-items-center border border-slate-300 text-lg"
                    type="button">×</button>
            </div>
            <div id="scheduleRows" class="mt-5 space-y-4"></div>
        </div>
    </dialog>
    <script type="module" src="js/teacher.js"></script>
</body>

</html>
